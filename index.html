<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Список задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f8;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #6b7491;
  --line: #e1e6f2;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --done: #1f9d6b;
  --danger: #e5484d;
  --shadow: 0 1px 2px rgba(27,34,54,.06), 0 12px 32px -12px rgba(27,34,54,.18);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #181c2e; --ink: #e8ebf7; --muted: #8b93b3;
    --line: #262b44; --accent: #7c8cff; --accent-ink: #0f1220; --accent-soft: #252b52;
    --done: #4cc38a; --danger: #ff6b70;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #181c2e; --ink: #e8ebf7; --muted: #8b93b3;
  --line: #262b44; --accent: #7c8cff; --accent-ink: #0f1220; --accent-soft: #252b52;
  --done: #4cc38a; --danger: #ff6b70;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 520px at 0% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
    radial-gradient(700px 480px at 100% 0%, color-mix(in srgb, #ff7ab6 16%, transparent), transparent 60%);
  background-attachment: fixed;
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }

header { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.ring { position: relative; width: 76px; height: 76px; flex: none; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent)); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.ring.full .bar { stroke: var(--done); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.titles { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; text-transform: capitalize; }
.theme {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
  transition: transform .2s;
}
.theme:hover { transform: rotate(18deg); }
.theme svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.add {
  display: flex; gap: 8px; padding: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
}
.add input {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font-size: 16px;
}
.add input::placeholder { color: var(--muted); }
.add input:focus-visible { outline: none; }
.add:focus-within { border-color: var(--accent); }
.add button {
  border: 0; color: var(--accent-ink); font-weight: 700;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #c06bff));
  padding: 0 22px; border-radius: 15px; transition: transform .15s, opacity .15s;
}
.add button:hover { opacity: .9; }
.add button:active { transform: scale(.96); }
.hint { margin: 8px 4px 0; font-size: 13px; color: var(--danger); min-height: 20px; }

.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 14px; flex-wrap: wrap; }
.filters { display: inline-flex; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.filters button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 10px;
  font-size: 14px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s;
}
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.count { font-size: 14px; color: var(--muted); font-weight: 500; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li {
  display: flex; align-items: center; gap: 14px; padding: 16px 14px 16px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 1px 2px rgba(27,34,54,.05), 0 8px 20px -14px rgba(27,34,54,.25);
  transition: opacity .2s, transform .2s, border-color .2s, box-shadow .2s, background .2s;
}
li:not(.empty):hover { border-color: var(--accent); transform: translateY(-1px); }
li.done { background: color-mix(in srgb, var(--surface) 65%, transparent); box-shadow: none; }
li.out { opacity: 0; transform: translateX(24px); }
li.in { animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

.check { position: relative; width: 26px; height: 26px; flex: none; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.check .box {
  position: absolute; inset: 0; border-radius: 9px; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: background .2s, border-color .2s;
  pointer-events: none;
}
.check .box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s .05s; }
.check input:checked + .box { background: var(--done); border-color: var(--done); }
.check input:checked + .box svg { stroke-dashoffset: 0; }
.check input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }

.text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; transition: color .2s; }
li.done .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--done); }

.del {
  flex: none; width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center; color: var(--muted); transition: background .2s, color .2s;
}
.del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

.clear {
  display: block; margin: 18px auto 0; border: 0; background: transparent;
  color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px;
}
.clear:hover { color: var(--danger); }
.clear[hidden] { display: none; }

.spark { position: fixed; z-index: 50; width: 9px; height: 9px; border-radius: 3px; pointer-events: none; animation: burst .95s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes burst { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

@media (max-width: 420px) {
  .app { padding-top: 24px; }
  h1 { font-size: 26px; }
  .ring { width: 64px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="ring" id="ring" aria-hidden="true">
      <svg viewBox="0 0 60 60">
        <circle class="track" cx="30" cy="30" r="26" fill="none" stroke-width="6"/>
        <circle class="bar" id="bar" cx="30" cy="30" r="26" fill="none" stroke-width="6" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
      </svg>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="titles">
      <h1>Мои задачи</h1>
      <p class="sub" id="date"></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Переключить тему">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="add">
    <input id="input" type="text" maxlength="200" placeholder="Что нужно сделать?" autocomplete="off" aria-label="Новая задача">
    <button id="addBtn" type="button">Добавить</button>
  </div>
  <p class="hint" id="hint" role="alert"></p>

  <div class="bar-row">
    <div class="filters" role="group" aria-label="Фильтр задач">
      <button type="button" data-f="all" aria-pressed="true">Все</button>
      <button type="button" data-f="active" aria-pressed="false">Активные</button>
      <button type="button" data-f="done" aria-pressed="false">Готовые</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
  <button class="clear" id="clear" type="button" hidden>Удалить выполненные</button>
</main>

<script>
(function () {
  var KEY = "todo.tasks.v1", THEME_KEY = "todo.theme";
  var tasks = [], filter = "all", wasFull = null;

  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), input = $("input"), hint = $("hint");

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      if (Array.isArray(data)) tasks = data.filter(function (t) { return t && typeof t.text === "string"; });
    } catch (e) { tasks = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  var svgCheck = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var svgTrash = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

  function makeItem(t, animate) {
    var li = document.createElement("li");
    li.dataset.id = t.id;
    if (t.done) li.classList.add("done");
    if (animate) li.classList.add("in");

    var label = document.createElement("label");
    label.className = "check";
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!t.done;
    cb.setAttribute("aria-label", "Выполнено: " + t.text);
    var box = document.createElement("span");
    box.className = "box"; box.innerHTML = svgCheck;
    label.appendChild(cb); label.appendChild(box);

    var span = document.createElement("span");
    span.className = "text"; span.textContent = t.text;

    var del = document.createElement("button");
    del.className = "del"; del.type = "button";
    del.setAttribute("aria-label", "Удалить задачу: " + t.text);
    del.innerHTML = svgTrash;

    cb.addEventListener("change", function () { toggle(t.id); });
    del.addEventListener("click", function () { remove(t.id, li); });

    li.appendChild(label); li.appendChild(span); li.appendChild(del);
    return li;
  }

  function render(newId) {
    var shown = tasks.filter(function (t) {
      return filter === "all" || (filter === "done" ? t.done : !t.done);
    });
    list.textContent = "";
    if (!shown.length) {
      var e = document.createElement("li");
      e.className = "empty"; e.style.display = "block"; e.style.border = "0"; e.style.background = "none"; e.style.boxShadow = "none";
      var s = document.createElement("strong");
      var p = document.createElement("span");
      if (!tasks.length) { s.textContent = "Пока нет задач"; p.textContent = "Напишите первую выше и нажмите Enter."; }
      else if (filter === "done") { s.textContent = "Готовых задач пока нет"; p.textContent = "Отметьте задачу галочкой, и она появится здесь."; }
      else { s.textContent = "Всё сделано"; p.textContent = "Активных задач не осталось."; }
      e.appendChild(s); e.appendChild(p); list.appendChild(e);
    } else {
      shown.forEach(function (t) { list.appendChild(makeItem(t, t.id === newId)); });
    }

    var total = tasks.length;
    var doneN = tasks.filter(function (t) { return t.done; }).length;
    var left = total - doneN;
    var pct = total ? Math.round(doneN / total * 100) : 0;
    $("pct").textContent = pct + "%";
    $("bar").style.strokeDashoffset = 163.36 * (1 - pct / 100);
    var full = total > 0 && doneN === total;
    $("ring").classList.toggle("full", full);
    if (full && wasFull === false) burst();
    wasFull = full;
    $("count").textContent = left + " " + plural(left, "задача", "задачи", "задач") + " осталось";
    $("clear").hidden = doneN === 0;
    document.querySelectorAll(".filters button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.f === filter));
    });
  }

  function burst() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var r = $("ring").getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var colors = ["#3d5afe", "#ff7ab6", "#1f9d6b", "#ffb020", "#8f6bff"];
    for (var i = 0; i < 28; i++) {
      var s = document.createElement("span");
      var a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
      s.className = "spark";
      s.style.left = cx + "px"; s.style.top = cy + "px";
      s.style.background = colors[i % colors.length];
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + 40 + "px");
      s.style.setProperty("--rot", Math.round(Math.random() * 540) + "deg");
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 1000); })(s);
    }
  }

  function add() {
    var text = input.value.trim();
    if (!text) { hint.textContent = "Введите текст задачи."; input.focus(); return; }
    hint.textContent = "";
    var t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, done: false };
    tasks.unshift(t);
    input.value = "";
    if (filter === "done") filter = "all";
    save(); render(t.id); input.focus();
  }
  function toggle(id) {
    tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
    save(); render();
  }
  function remove(id, li) {
    li.classList.add("out");
    setTimeout(function () {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      save(); render();
    }, 180);
  }

  $("addBtn").addEventListener("click", add);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  input.addEventListener("input", function () { hint.textContent = ""; });
  document.querySelectorAll(".filters button").forEach(function (b) {
    b.addEventListener("click", function () { filter = b.dataset.f; render(); });
  });
  $("clear").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });

  // Тема
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  } catch (e) {}
  $("theme").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  $("date").textContent = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });

  load(); render();
})();
</script>
</body>
</html>
